<svg xmlns="http://www.w3.org/2000/svg" width="720" height="210" viewBox="0 0 720 210" role="img" aria-label="coordinate frame">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6270"/></marker></defs>
<rect width="720" height="210" rx="10" fill="#f7f8fa"/>
<line x1="150" y1="170" x2="280" y2="170" stroke="#5b6270" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="150" y1="170" x2="150" y2="40" stroke="#5b6270" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="150" y1="170" x2="235" y2="100" stroke="#5b6270" stroke-width="1.6" marker-end="url(#a)"/>
<text x="288" y="175" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1d2330">x  east</text>
<text x="138" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1d2330">y  up</text>
<text x="242" y="94" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1d2330">z  north</text>
<text x="140" y="192" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#394150">0</text>
<text x="330" y="60" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1d2330">The game&#x27;s own world units (not metres):</text>
<text x="330" y="80" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1d2330">x east, y up (sea level 0), z north.</text>
<text x="330" y="100" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1d2330">dirX/dirY/dirZ: where the bow points,</text>
<text x="330" y="120" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1d2330">a unit vector in the same frame.</text>
<text x="330" y="140" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1d2330">Kept at scale 1, as the game has them.</text>
