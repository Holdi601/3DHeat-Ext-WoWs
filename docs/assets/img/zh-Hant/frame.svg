<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Where x, y and z point"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6270"/></marker></defs><rect width="880" height="300" rx="10" fill="#f7f8fa"/>
<text x="440" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#1d2330">x、y、z 指向何方</text>
<polygon points="60,250 300,250 380,170 140,170" fill="#e8eef7" stroke="#5b6270" stroke-width="1"/>
<text x="220" y="272" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">x 與 z 平鋪在海面上</text>
<line x1="170" y1="210" x2="300" y2="210" stroke="#1d2330" stroke-width="2.2" marker-end="url(#a)"/>
<text x="306" y="215" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1d2330">x：東</text>
<line x1="170" y1="210" x2="170" y2="70" stroke="#1d2330" stroke-width="2.2" marker-end="url(#a)"/>
<text x="178" y="78" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1d2330">y：上</text>
<line x1="170" y1="210" x2="250" y2="130" stroke="#1d2330" stroke-width="2.2" marker-end="url(#a)"/>
<text x="256" y="128" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1d2330">z：北</text>
<text x="430" y="100" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1d2330">遊戲自己的單位（非公尺）</text>
<text x="430" y="124" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#394150">x 朝東、y 向上（海平面為 0）、z 朝北。</text>
<text x="430" y="148" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#394150">dirX、dirY、dirZ：船頭所朝的方向。</text>
<text x="430" y="172" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#394150">以比例 1 保留，與遊戲中相同。</text>
</svg>
