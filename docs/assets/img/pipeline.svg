<text x="367.0" y="134.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#394150">deciphers the stream</text>
<text x="367.0" y="151.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#394150">reads every packet</text>
<text x="367.0" y="168.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#394150">kept or decoded</text>
