<text x="609.0" y="62" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#394150">the table: positions</text>
<text x="609.0" y="79" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#394150">and events, where they happened</text>
<line x1="714" y1="57.0" x2="746" y2="152.0" stroke="#5b6270" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="472" y1="152.0" x2="502" y2="145.0" stroke="#5b6270" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="504" y="108" width="210" height="74" rx="8" fill="#ffffff" stroke="#5b6270" stroke-width="1.2"/>
<text x="609.0" y="130" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1d2330">&lt;match&gt;.match.json</text>
<text x="609.0" y="150" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#394150">the match document:</text>
<text x="609.0" y="167" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#394150">players, kills, results ...</text>
