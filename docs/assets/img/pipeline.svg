<svg xmlns="http://www.w3.org/2000/svg" width="980" height="304" viewBox="0 0 980 304" role="img" aria-label=".wowsreplay to 3DHeat">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6270"/></marker></defs>
<rect width="980" height="304" rx="10" fill="#f7f8fa"/>
<rect x="20" y="92.0" width="210" height="120" rx="8" fill="#ffffff" stroke="#5b6270" stroke-width="1.2"/>
