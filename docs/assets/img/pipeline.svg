<text x="609.0" y="218" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1d2330">&lt;match&gt;.messages.parquet</text>
<text x="609.0" y="238" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#394150">the sidecar: everything</text>
<text x="609.0" y="255" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#394150">else, kept whole</text>
