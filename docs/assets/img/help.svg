<text x="316.0" y="17" fill="#9aa0aa" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">heat3d-wows-replay --help</text>
<g font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13" xml:space="preserve" style="white-space:pre">
<text x="16" y="46" fill="#7ee787" xml:space="preserve" style="white-space:pre">$&#160;heat3d-wows-replay&#160;--help</text>
<text x="16" y="64" fill="#d6d9df" xml:space="preserve" style="white-space:pre">usage:&#160;heat3d-wows-replay&#160;[-h]&#160;-o&#160;OUT&#160;[--force]&#160;[--ship-names&#160;JSON]</text>
<text x="16" y="82" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;[--version]</text>
<text x="16" y="100" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;replays&#160;[replays&#160;...]</text>
<text x="16" y="118" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="136" fill="#d6d9df" xml:space="preserve" style="white-space:pre">World&#160;of&#160;Warships&#160;replays&#160;into&#160;3DHeat&#160;tables</text>
<text x="16" y="154" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="172" fill="#d6d9df" xml:space="preserve" style="white-space:pre">positional&#160;arguments:</text>
<text x="16" y="190" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;replays&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;.wowsreplay&#160;files,&#160;or&#160;folders&#160;searched&#160;for&#160;them</text>
<text x="16" y="208" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="226" fill="#d6d9df" xml:space="preserve" style="white-space:pre">options:</text>
<text x="16" y="244" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;-h,&#160;--help&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;show&#160;this&#160;help&#160;message&#160;and&#160;exit</text>
<text x="16" y="262" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;-o,&#160;--out&#160;OUT&#160;&#160;&#160;&#160;&#160;&#160;folder&#160;to&#160;write&#160;into&#160;(a&#160;folder&#160;per&#160;map&#160;inside)</text>
<text x="16" y="280" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--force&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;convert&#160;again&#160;what&#160;is&#160;already&#160;written</text>
<text x="16" y="298" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--ship-names&#160;JSON&#160;&#160;a&#160;JSON&#160;object&#160;of&#160;shipId&#160;-&gt;&#160;ship&#160;name;&#160;replays&#160;carry&#160;only</text>
<text x="16" y="316" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;the&#160;number&#160;for&#160;every&#160;ship&#160;but&#160;the&#160;recording&#160;player&#x27;s</text>
<text x="16" y="334" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--version&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;show&#160;program&#x27;s&#160;version&#160;number&#160;and&#160;exit</text>
