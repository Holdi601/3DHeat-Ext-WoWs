<svg xmlns="http://www.w3.org/2000/svg" width="804" height="354" viewBox="0 0 804 354" role="img" aria-label="heat3d-wows-replay">
<rect width="804" height="354" rx="8" fill="#1e1f24"/>
<rect width="804" height="26" rx="8" fill="#2c2e35"/><rect y="18" width="804" height="8" fill="#2c2e35"/>
<circle cx="16" cy="13" r="5" fill="#ff5f57"/><circle cx="32" cy="13" r="5" fill="#febc2e"/><circle cx="48" cy="13" r="5" fill="#28c840"/>
<text x="402.0" y="17" fill="#9aa0aa" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">heat3d-wows-replay</text>
<g font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="14" xml:space="preserve" style="white-space:pre">
<text x="16" y="46" fill="#7ee787" xml:space="preserve" style="white-space:pre">$&#160;heat3d-wows-replay&#160;--help</text>
<text x="16" y="65" fill="#d6d9df" xml:space="preserve" style="white-space:pre">usage:&#160;heat3d-wows-replay&#160;[-h]&#160;-o&#160;OUT&#160;[--force]&#160;[--ship-names&#160;JSON]&#160;[--version]</text>
<text x="16" y="84" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;replays&#160;[replays&#160;...]</text>
<text x="16" y="103" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="122" fill="#d6d9df" xml:space="preserve" style="white-space:pre">World&#160;of&#160;Warships&#160;replays&#160;into&#160;3DHeat&#160;tables</text>
<text x="16" y="141" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="160" fill="#d6d9df" xml:space="preserve" style="white-space:pre">positional&#160;arguments:</text>
<text x="16" y="179" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;replays&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;.wowsreplay&#160;files,&#160;or&#160;folders&#160;searched&#160;for&#160;them</text>
<text x="16" y="198" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="217" fill="#d6d9df" xml:space="preserve" style="white-space:pre">options:</text>
<text x="16" y="236" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;-h,&#160;--help&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;show&#160;this&#160;help&#160;message&#160;and&#160;exit</text>
<text x="16" y="255" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;-o,&#160;--out&#160;OUT&#160;&#160;&#160;&#160;&#160;&#160;folder&#160;to&#160;write&#160;into&#160;(a&#160;folder&#160;per&#160;map&#160;inside)</text>
<text x="16" y="274" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--force&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;convert&#160;again&#160;what&#160;is&#160;already&#160;written</text>
<text x="16" y="293" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--ship-names&#160;JSON&#160;&#160;a&#160;JSON&#160;object&#160;of&#160;shipId&#160;-&gt;&#160;ship&#160;name;&#160;replays&#160;carry&#160;only&#160;the&#160;number&#160;for</text>
<text x="16" y="312" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;every&#160;ship&#160;but&#160;the&#160;recording&#160;player&#x27;s</text>
<text x="16" y="331" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--version&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;show&#160;program&#x27;s&#160;version&#160;number&#160;and&#160;exit</text>
</g></svg>
