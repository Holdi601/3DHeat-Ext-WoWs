<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490" role="img" aria-label="From a replay to the 3DHeat viewer"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6270"/></marker></defs><rect width="880" height="490" rx="10" fill="#f7f8fa"/>
<text x="440" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#1d2330">리플레이에서 3DHeat 뷰어까지</text>
<rect x="20" y="48" width="840" height="80" rx="8" fill="#ffffff" stroke="#5b6270" stroke-width="1.2"/>
<text x="440" y="72" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1d2330">1. 리플레이</text>
<text x="440" y="94" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">.wowsreplay 파일, 또는 이 파일들이 든 폴더</text>
<text x="440" y="114" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">(폴더는 하위 폴더까지 찾아요)</text>
<line x1="440" y1="128" x2="440" y2="160" stroke="#5b6270" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="20" y="162" width="840" height="80" rx="8" fill="#eef4ff" stroke="#5b6270" stroke-width="1.2"/>
<text x="440" y="186" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1d2330">2. heat3d-wows-replay</text>
<text x="440" y="208" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">리플레이의 모든 부분을 읽어요</text>
<text x="440" y="228" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">읽은 것을 확인해요</text>
<line x1="440" y1="242" x2="440" y2="274" stroke="#5b6270" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="20" y="276" width="264" height="80" rx="8" fill="#ffffff" stroke="#5b6270" stroke-width="1.2"/>
<text x="152" y="300" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1d2330">&lt;match&gt;.parquet</text>
<text x="152" y="322" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">테이블:</text>
<text x="152" y="342" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">위치와 이벤트</text>
<rect x="308" y="276" width="264" height="80" rx="8" fill="#ffffff" stroke="#5b6270" stroke-width="1.2"/>
<text x="440" y="300" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1d2330">&lt;match&gt;.match.json</text>
<text x="440" y="322" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">매치 문서:</text>
<text x="440" y="342" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">플레이어, 처치, 결과</text>
<rect x="596" y="276" width="264" height="80" rx="8" fill="#ffffff" stroke="#5b6270" stroke-width="1.2"/>
<text x="728" y="300" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1d2330">&lt;match&gt;.messages.parquet</text>
<text x="728" y="322" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">사이드카: 그 밖의 모든 것</text>
<text x="728" y="342" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">그 밖에는 통째로 보관</text>
<line x1="440" y1="356" x2="440" y2="388" stroke="#5b6270" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="20" y="390" width="840" height="80" rx="8" fill="#eef4ff" stroke="#5b6270" stroke-width="1.2"/>
<text x="440" y="414" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1d2330">3. 3DHeat 뷰어</text>
<text x="440" y="436" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">히트맵 탭: 테이블</text>
<text x="440" y="456" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">매치 탭: 매치 문서</text>
</svg>
